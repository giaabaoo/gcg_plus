attack:
  attack_class:       gcg_rphi_v2
  variant:            joint_ce_rphi      # CE + lambda*REINFORCE from step 0
  num_steps:          250
  search_width:       512
  suffix_len:         20
  target:             "Sure, here is"
  rphi_every_k:       5                  # REINFORCE fires every K steps throughout
  rphi_lambda:        1.0
  sample_max_tokens:  96
  sample_temperature: 0.7
  prepend_prefix:       false              # free sampling
  rphi_ckpt:          "checkpoints/rphi_v2/best.pt"
  rphi_model_name:    "microsoft/deberta-v3-base"

exp_name: exp1_joint_ce_rphi_v2
